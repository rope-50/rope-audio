name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  cpp:
    name: C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # miniaudio-only (tests use the Null backend, so no audio device is
        # needed); skip RtAudio/ASIO and the device-opening examples.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DROPE_AUDIO_BACKEND_RTAUDIO=OFF
          -DROPE_AUDIO_BUILD_EXAMPLES=OFF
          -DROPE_AUDIO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Generate codec fixtures (Linux)
        # ffmpeg encodes a short tone to FLAC/MP3/OGG so the decode tests run for
        # real on one platform; other OSes skip them (ROPE_FIXTURE_DIR unset).
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p fixtures
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=0.5" -ac 1 -ar 48000 fixtures/tone.wav
          ffmpeg -y -i fixtures/tone.wav fixtures/tone.flac
          ffmpeg -y -i fixtures/tone.wav -c:a libmp3lame -b:a 128k fixtures/tone.mp3
          ffmpeg -y -i fixtures/tone.wav -c:a libvorbis fixtures/tone.ogg
          echo "ROPE_FIXTURE_DIR=$PWD/fixtures" >> "$GITHUB_ENV"

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  flutter:
    name: Flutter plugin (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/flutter/rope_audio
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib test

      - name: Test
        run: flutter test

  csharp:
    name: C# bindings (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build shared native library
        run: >
          cmake -S . -B build-shared
          -DCMAKE_BUILD_TYPE=Release
          -DROPE_AUDIO_BACKEND_RTAUDIO=OFF
          -DROPE_AUDIO_BUILD_EXAMPLES=OFF
          -DROPE_AUDIO_BUILD_TESTS=OFF
          -DROPE_AUDIO_BUILD_SHARED=ON
          && cmake --build build-shared --config Release --target rope_audio_shared

      - name: Locate native library
        run: echo "ROPE_AUDIO_NATIVE=$(find "$PWD/build-shared" -name 'librope_audio.so' | head -n1)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build bindings
        run: dotnet build bindings/csharp/RopeAudio/RopeAudio.csproj -c Release

      - name: Run headless smoke (Null backend + offline render)
        run: dotnet run --project bindings/csharp/RopeAudio.Smoke -c Release
